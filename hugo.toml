baseURL = 'https://www.rbceubank.com/'
languageCode = 'en-us'
title = 'Refuge Baptist Church'
theme = 'hugo-hero'

[module]
  [module.hugoVersion]
    extended = true
    min = "0.92.0"

[params]
  google_analytics_id=""

  [params.logo]
    mobile = "images/logo-mobile.svg"
    mobile_height = "36px"
    mobile_width = "36px"
    desktop = "images/logo.svg"
    desktop_height = "29px"
    desktop_width = "217px"
