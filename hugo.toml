    meta_og_url = "https://www.rbceubank.com/"
    meta_og_image = ""
    meta_og_description = "Join Refuge Baptist Church in Eubank, Kentucky for worship, Sunday School, and Bible study."
    meta_twitter_card = "summary"
    meta_twitter_site = ""
    meta_twitter_creator = ""

