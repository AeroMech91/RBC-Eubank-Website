<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  .hero-image-fullscreen {
    background-position: center 35%;
  }
  .hero-image-fullscreen::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: rgba(0, 0, 0, .42);
  }
  .hero-image-fullscreen .container {
    position: relative;
    z-index: 1;
  }
  .hero-image-fullscreen .hero-text {
    position: absolute;
    top: 12%;
    left: 4%;
    width: min(58%, 650px);
    margin: 0;
    text-align: left;
  }
  .hero-image-fullscreen .hero-text h1 {
    width: 100%;
    font-family: 'Dancing Script', cursive;
    font-size: 4rem;
    font-weight: 700;
    line-height: 1.12;
    text-shadow: 0 2px 10px rgba(0, 0, 0, .6);
  }
  .hero-image-fullscreen .hero-text p {
    width: 100%;
    font-size: 1.35rem;
    text-shadow: 0 2px 8px rgba(0, 0, 0, .75);
  }
  @media (max-width: 991.98px) {
    .hero-image-fullscreen .hero-text {
      top: 14%;
      left: 5%;
      width: min(68%, 520px);
    }
    .hero-image-fullscreen .hero-text h1 {
      font-size: 3.2rem;
    }
    .hero-image-fullscreen .hero-text p {
      font-size: 1.15rem;
    }
  }
  @media (max-width: 767.98px) {
    .hero-image-fullscreen .hero-text {
      top: 18%;
      left: 5%;
      width: min(78%, 420px);
      text-align: left;
    }
    .hero-image-fullscreen .hero-text h1 {
      font-size: 2.5rem;
    }
    .hero-image-fullscreen .hero-text p {
      font-size: 1rem;
    }
  }
</style>
<div class="hero-image hero-image-fullscreen" style="background-image: url('{{ .background | relURL }}'); background-color: transparent; background-blend-mode: normal;">
  <div class="container">
    <div class="hero-text">
      <span class="hero-section">{{ .section }}</span>
      <h1>{{ .heading }}</h1>
      <p>{{ .subheading }}</p>
    </div>
    <div class="hero-down">
      <a href="#home" aria-label="Scroll to page content">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60" aria-hidden="true" focusable="false">
          <path fill="#fff" transform="translate(30 30) scale(.69) translate(-449 -267)" d="M224.687 309.061L0 84.372l42.186-42.186L84.372 0l182.815 182.811L450 365.622l182.5-182.496L815 .63l41.874 41.874L898.75 84.38 674.062 309.065 449.373 533.751 224.687 309.06z" />
        </svg>
      </a>
    </div>
  </div>
</div>
