<div class="sub-footer">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="sub-footer-inner">
          <ul style="display: flex; width: 100%; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0 24px; text-align: center;">
            {{ with .Site.Data.contact.phone }}<li style="display: inline-block; margin: 0;"><strong>Phone: </strong><a href="tel:{{ replaceRE `[^0-9+]` `` . }}">{{ . }}</a></li>{{ end }}
            {{ with .Site.Data.contact.email }}<li style="display: inline-block; margin: 0;"><strong>Email: </strong><a href="mailto:{{ . }}">{{ . }}</a></li>{{ end }}
            {{ with .Site.Data.contact.address }}<li style="display: inline-block; margin: 0;"><strong>Address: </strong>{{ . }}</li>{{ end }}
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
